name: Security regression

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zap-regression:
    name: ZAP regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PRODUCT_SHA: ${{ github.sha }}
      REGRESSION_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      REGRESSION_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout ByteMe event commit
        id: product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: product
          persist-credentials: false
      - name: Checkout pinned testing-tool runtime
        id: runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hehuanglu/testing-tool
          ref: 54766f0182bbdb32d1401f37383b8c3599586877
          path: runner
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify runtime checkout and Docker
        id: preflight
        run: |
          pin="$(awk '$1 == "repository:" && $2 == "hehuanglu/testing-tool" { getline; if ($1 == "ref:") print $2 }' \
            "$GITHUB_WORKSPACE/product/.github/workflows/security-regression.yml")"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C "$GITHUB_WORKSPACE/runner" rev-parse HEAD)" = "$pin"
          test -z "$(git -C "$GITHUB_WORKSPACE/runner" status --porcelain)"
          docker info --format '{{.ServerVersion}}'
          printf 'EXPECTED_RUNNER_SHA=%s\n' "$pin" >> "$GITHUB_ENV"
      - name: Run the ByteMe security suite
        id: suite
        run: |
          exec bash "$GITHUB_WORKSPACE/runner/tests/security/run_zap_product_suite.sh" \
            --cases "$GITHUB_WORKSPACE/product/tests/security/cases" \
            --product-source "$GITHUB_WORKSPACE/product" \
            --expected-product-sha "$EXPECTED_PRODUCT_SHA" \
            --require-cases \
            --variant upstream-original \
            --deadline 600 \
            --out "$RUNNER_TEMP/zap-results"
      - name: Reconcile invocation-owned Docker resources
        if: always() && steps.suite.outcome != 'skipped'
        run: |
          python3 "$GITHUB_WORKSPACE/runner/tests/security/ci/cleanup_owned.py" "$RUNNER_TEMP/zap-results"
      - name: Write summary and JUnit
        if: always()
        env:
          PRODUCT_CHECKOUT: ${{ steps.product.outcome }}
          RUNTIME_CHECKOUT: ${{ steps.runtime.outcome }}
          PYTHON_SETUP: ${{ steps.python.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          SUITE_EXECUTION: ${{ steps.suite.outcome }}
        run: |
          results="$RUNNER_TEMP/zap-results"
          mkdir -p "$results"
          if [[ ! -f "$results/suite-results.json" ]]; then
            mkdir -p "$RUNNER_TEMP/zap-artifact"
            /usr/bin/python3 - "$RUNNER_TEMP/zap-artifact/bootstrap.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          fields = ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_EVENT_NAME",
                    "EXPECTED_PRODUCT_SHA", "PRODUCT_CHECKOUT", "RUNTIME_CHECKOUT",
                    "PYTHON_SETUP", "PREFLIGHT", "SUITE_EXECUTION")
          status = "CANCELLED" if os.environ.get("SUITE_EXECUTION") == "cancelled" else "ERROR"
          code = "SUITE_CANCELLED" if status == "CANCELLED" else "BOOTSTRAP_FAILED"
          destination = Path(sys.argv[1])
          diagnostic = {"status": status, "code": code,
                        **{key: os.environ.get(key) for key in fields}}
          cleanup_file = Path(os.environ["RUNNER_TEMP"]) / "zap-results/fallback-cleanup.json"
          if cleanup_file.is_file():
              cleanup = json.loads(cleanup_file.read_text())
              diagnostic["fallbackCleanup"] = {
                  "status": cleanup["status"],
                  "recordCount": len(cleanup["records"]),
              }
              (destination.parent / cleanup_file.name).write_text(
                  json.dumps(cleanup, sort_keys=True) + "\n")
          destination.write_text(json.dumps(diagnostic, sort_keys=True) + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"## ZAP regression · {status}\n\n`{code}`. See bootstrap.json.\n")
          PY
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/runner/tests/security/ci/write_summary.py" "$results"
      - name: Stage allowlisted artifacts
        if: always() && hashFiles('runner/tests/security/ci/verify_artifacts.py') != ''
        run: |
          if [[ -f "$RUNNER_TEMP/zap-results/suite-results.json" ]]; then
            python3 "$GITHUB_WORKSPACE/runner/tests/security/ci/verify_artifacts.py" stage \
              "$RUNNER_TEMP/zap-results" "$RUNNER_TEMP/zap-artifact"
          fi
      - name: Upload security regression artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-regression-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/zap-artifact
          if-no-files-found: error
          retention-days: 14
